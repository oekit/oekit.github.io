name: CI

# 触发条件说明（2026-10-20 补）：
# 原来只有 pull_request + workflow_dispatch，**push 到 main 不触发**——站点是发布物，
# 「发布出去的这一刻内容对不对」才是门禁该管的事；合入后无人守 = 门禁形同虚设
# （别人改了模块仓、或 bot 直接推 main，漂移都没人拦）。content job 成本极低
# （clone 两个仓 + 跑一个 py 脚本，约 1 分钟），补上 push:main。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # VitePress 构建内建死链检查，失败即挡

  # 站点**内容正确性**门禁（2026-10-20 新增）。
  # build job 只做死链检查——文案数字错、llms.txt 漏模块条目，它一律放行。
  # 判据独立：期望值来自 matrix-tools 的模块登记表（matrix.py 的 MODULES），
  # 不是站点自己的口径；模块仓的 go.mod 实数由 matrix-tools 仓的 audit.yml 侧
  # 独立 oracle 复核。
  content:
    name: Content gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ★ 源面钉扎（2026-11-23 新增）：站点内容与 matrix-tools 的**状态**强绑定——
      #   llms.txt 的模块集合必须与源登记的 MODULES **完全相等**，且每个「N 个模块/
      #   发版单元」数字必须等于源算出的计数。于是：源一改模块集，跑**源 main** 的
      #   本门禁必然转红 ⇒ 站点要先合（才能绿）⇒ 源的审计又要站点已合（才能绿）
      #   ⇒ 两个仓互为前置，死锁。
      #   ⇒ 钉扎让站点**声明**自己对应哪个源状态，门禁按声明取源：
      #     · 源未合并期间：钉**提交 SHA**（不可变，且合并后仍在历史里可达，
      #       不受「合并后自动删分支」影响）；
      #     · 源合并后：钉 main（或源的发版号），由后续 PR 跟进。
      #   声明漂移由 matrix-tools 侧的审计兜底（它拿源的真实状态复核站点）。
      - name: Determine matrix-tools ref（站点声明的源状态）
        id: src
        run: |
          ref=$(cat data/matrix_tools_ref 2>/dev/null | tr -d '[:space:]')
          [ -n "$ref" ] || ref=main
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # ★ 源必须落在**站点工作区之外**：站点门禁会递归扫工作区里的 .md/.txt，
      #   若把源克隆进工作区，判据会把**裁判自己的** CHANGELOG/文档一起扫进去
      #   （实测：源的 CHANGELOG 里历史条目「24 个模块」被当成站点文案数 ⇒ 假红）。
      #   ⇒ 克隆到 RUNNER_TEMP，扫描面只剩站点自己的文件。
      - name: Fetch matrix-tools（源状态，取自站点声明）
        run: |
          dir="$RUNNER_TEMP/matrix-tools"
          git clone --quiet https://github.com/oekit/matrix-tools "$dir"
          cd "$dir"
          git fetch --quiet origin "${{ steps.src.outputs.ref }}"
          git checkout --quiet "${{ steps.src.outputs.ref }}"
          echo "matrix-tools 已取到 ${{ steps.src.outputs.ref }}"

      - name: 站点文案口径 + llms.txt 模块覆盖
        run: python3 "$RUNNER_TEMP/matrix-tools/scripts/verify_site_copy.py" --site .
