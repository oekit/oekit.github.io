<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1056" viewBox="0 0 1240 1056" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#868E96"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4C6EF5"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1240" height="1056" rx="16" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1239" height="1055" rx="16" fill="none" stroke="#E9ECEF"/>

  <!-- header -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1B1F3B">oekit 模块矩阵 · 架构总览</text>
  <text x="40" y="74" font-size="13" fill="#66708A">23 个独立发版的 Go 模块（SemVer + 独立 CI）· 依赖自底向上 · github.com/oekit</text>
  <text x="1200" y="48" font-size="12" fill="#98A2B3" text-anchor="end">Go 1.25+ · MIT</text>

  <!-- ============ 你的服务 ============ -->
  <rect x="32" y="96" width="1176" height="56" rx="10" fill="#FFFFFF" stroke="#868E96" stroke-dasharray="6 4"/>
  <text x="620" y="130" font-size="15" font-weight="600" fill="#495057" text-anchor="middle">你的服务 · 业务微服务（Hertz HTTP / Kitex RPC）</text>

  <line x1="620" y1="154" x2="620" y2="172" stroke="#868E96" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="634" y="168" font-size="11" fill="#98A2B3">组合 · 引导</text>

  <!-- ============ 应用引导 · 框架生态 ============ -->
  <rect x="32" y="178" width="1176" height="190" rx="12" fill="#F5F8FF" stroke="#BAC8FF"/>
  <text x="48" y="202" font-size="13" font-weight="700" fill="#3B5BDB">应用引导 · 框架生态</text>

  <!-- row 1 -->
  <rect x="48" y="214" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#BAC8FF"/>
  <text x="64" y="238" font-size="15" font-weight="600" fill="#364FC7">workflow</text>
  <text x="64" y="260" font-size="11.5" fill="#6B7280">串行/并行/异步编排 · Hook</text>

  <rect x="288" y="214" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#BAC8FF"/>
  <text x="304" y="238" font-size="15" font-weight="600" fill="#364FC7">istio</text>
  <text x="304" y="260" font-size="11.5" fill="#6B7280">xDS 熔断 · 零内部依赖</text>

  <rect x="508" y="214" width="210" height="64" rx="8" fill="#FFFFFF" stroke="#BAC8FF" stroke-dasharray="5 4"/>
  <text x="524" y="238" font-size="15" font-weight="600" fill="#364FC7">kitex-examples</text>
  <text x="524" y="260" font-size="11.5" fill="#6B7280">echo 示例 · 治理配置</text>

  <rect x="738" y="214" width="454" height="64" rx="8" fill="#EDF2FF" stroke="#BAC8FF"/>
  <text x="754" y="240" font-size="11.5" fill="#3B5BDB">hertz.RunServer / kitex.RunServer → bootstrap 组合根</text>
  <text x="754" y="260" font-size="11.5" fill="#3B5BDB">统一组合与优雅关停：排空连接 → 释放资源</text>

