  <rect x="48" y="642" width="250" height="64" rx="8" fill="#FFFFFF" stroke="#FFD8A8"/>
  <text x="64" y="666" font-size="15" font-weight="600" fill="#D9480F">gorm</text>
  <text x="64" y="688" font-size="11.5" fill="#6B7280">连接池增强 · CRUD Service</text>

  <rect x="318" y="642" width="250" height="64" rx="8" fill="#FFFFFF" stroke="#FFD8A8"/>
  <text x="334" y="666" font-size="15" font-weight="600" fill="#D9480F">redis</text>
  <text x="334" y="688" font-size="11.5" fill="#6B7280">客户端 · 缓存后端 · 分布式锁</text>

  <rect x="588" y="642" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#FFD8A8"/>
  <text x="604" y="666" font-size="15" font-weight="600" fill="#D9480F">data</text>
  <text x="604" y="688" font-size="11.5" fill="#6B7280">LocalCache · 缓存检查器</text>

  <rect x="838" y="642" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#FFD8A8"/>
