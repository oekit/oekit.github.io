  <text x="64" y="804" font-size="15" font-weight="600" fill="#6741D9">logx</text>
  <text x="64" y="826" font-size="11.5" fill="#6B7280">统一门面 · 多后端 · Sink</text>

  <rect x="328" y="780" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#D0BFFF"/>
  <text x="344" y="804" font-size="15" font-weight="600" fill="#6741D9">tracing</text>
  <text x="344" y="826" font-size="11.5" fill="#6B7280">OpenTelemetry · trace_id</text>

  <rect x="608" y="780" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#D0BFFF"/>
  <text x="624" y="804" font-size="15" font-weight="600" fill="#6741D9">metrics</text>
  <text x="624" y="826" font-size="11.5" fill="#6B7280">Prometheus · 弹性指标族</text>

  <text x="900" y="806" font-size="11.5" fill="#845EF7">全矩阵统一可观测门面</text>
  <text x="900" y="826" font-size="11.5" fill="#845EF7">结构化日志 / OTel 链路 / 指标</text>

  <line x1="620" y1="860" x2="620" y2="878" stroke="#868E96" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ 基础库 ============ -->
  <rect x="32" y="882" width="1176" height="114" rx="12" fill="#F4F6F8" stroke="#CED4DA"/>
  <text x="48" y="906" font-size="13" font-weight="700" fill="#343A40">基础库</text>

  <rect x="48" y="918" width="420" height="64" rx="8" fill="#FFFFFF" stroke="#CED4DA"/>
  <text x="64" y="940" font-size="15" font-weight="600" fill="#343A40">pkg <tspan font-size="11.5" font-weight="400" fill="#868E96">微工具集 16 合 1</tspan></text>
  <text x="64" y="956" font-size="10" fill="#868E96">errors · validator · stringx · slicex · enumx · convert · encoding · jsonrepair · httpjson</text>
  <text x="64" y="970" font-size="10" fill="#868E96">mathx · pathx · pagination · ptrx · timex · uidgen · cache</text>

  <rect x="488" y="918" width="280" height="64" rx="8" fill="#FFFFFF" stroke="#CED4DA"/>
  <text x="504" y="940" font-size="15" font-weight="600" fill="#343A40">concurrency</text>
  <text x="504" y="962" font-size="11.5" fill="#6B7280">GoSafe · singleflight · retry</text>

  <rect x="788" y="918" width="280" height="64" rx="8" fill="#FFFFFF" stroke="#CED4DA"/>
  <text x="804" y="940" font-size="15" font-weight="600" fill="#343A40">core</text>
  <text x="804" y="962" font-size="11.5" fill="#6B7280">governance · lifecycle · IP 工具</text>

  <!-- footer -->
  <text x="40" y="1022" font-size="11.5" fill="#98A2B3">依赖方向：上层依赖下层，全矩阵无环 · 每仓独立发版（SemVer）+ 独立 CI（Lint / Test）</text>
  <text x="40" y="1040" font-size="11.5" fill="#98A2B3">模块索引：https://github.com/oekit · 文档：https://oekit.github.io · llms.txt 供 AI Agent 检索</text>
