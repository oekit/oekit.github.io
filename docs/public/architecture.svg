  <text x="292" y="336" font-size="11.5" fill="#4C5FD5">组合根 · App/Run · healthz</text>

  <rect x="564" y="290" width="190" height="64" rx="8" fill="#FFFFFF" stroke="#BAC8FF"/>
  <text x="580" y="314" font-size="15" font-weight="600" fill="#364FC7">middleware</text>
  <text x="580" y="336" font-size="11.5" fill="#6B7280">标准栈 · contrib 桥接</text>

  <rect x="772" y="290" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#BAC8FF"/>
  <text x="788" y="314" font-size="15" font-weight="600" fill="#364FC7">handler</text>
  <text x="788" y="336" font-size="11.5" fill="#6B7280">CRUD Handler · 绑定</text>

  <rect x="960" y="290" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#BAC8FF"/>
