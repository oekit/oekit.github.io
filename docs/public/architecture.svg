  <!-- row 1 -->
  <rect x="48" y="428" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#96F2D7"/>
  <text x="64" y="452" font-size="15" font-weight="600" fill="#087F5B">httpx</text>
  <text x="64" y="474" font-size="11.5" fill="#6B7280">LB · 熔断/重试 · OTel 透传</text>

  <rect x="308" y="428" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#96F2D7"/>
  <text x="324" y="452" font-size="15" font-weight="600" fill="#087F5B">nns-endpoint</text>
  <text x="324" y="474" font-size="11.5" fill="#6B7280">per-service 熔断 · 换实例重试</text>

  <rect x="568" y="428" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#96F2D7"/>
  <text x="584" y="452" font-size="15" font-weight="600" fill="#087F5B">network</text>
  <text x="584" y="474" font-size="11.5" fill="#6B7280">WS/NATS/MQ · 连接工具</text>

  <rect x="808" y="428" width="384" height="64" rx="8" fill="#E6FCF5" stroke="#96F2D7"/>
  <text x="824" y="454" font-size="11.5" fill="#087F5B">hertz / kitex → nns → registry（服务发现链）</text>
  <text x="824" y="474" font-size="11.5" fill="#087F5B">nns-endpoint → httpx（端点级弹性）</text>

  <!-- row 2 -->
  <rect x="48" y="504" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#96F2D7"/>
  <text x="64" y="528" font-size="15" font-weight="600" fill="#087F5B">nns</text>
  <text x="64" y="550" font-size="11.5" fill="#6B7280">发现/配置/实例缓存 · 降级</text>

  <rect x="328" y="504" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#96F2D7"/>
  <text x="344" y="528" font-size="15" font-weight="600" fill="#087F5B">registry</text>
  <text x="344" y="550" font-size="11.5" fill="#6B7280">注册发现核心 + Nacos 实现</text>

